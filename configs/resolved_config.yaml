embedding:
  batch_size: 256
  precision: fp32
  l2_normalized: true
  classification_prompts:
    cifar10: a photo of a {}.
    cifar100: a photo of a {}.
    eurosat: a centered satellite photo of {}.
    svhn: 'a street sign of the number: "{}".'
  eurosat_class_names:
  - annual crop land
  - forest
  - brushland or shrubland
  - highway or road
  - industrial buildings or commercial buildings
  - pasture land
  - permanent crop land
  - residential buildings or homes or apartments
  - river
  - lake or sea
  classification_train_subset: 10000
  classification_train_subset_seed: 0
  retrieval_sets:
    flickr30k_test:
    - flickr30k
    - test
    flickr30k_train:
    - flickr30k
    - train
    mscoco_test:
    - mscoco
    - test
    mscoco_train:
    - mscoco
    - train
bootstrap:
  n_resamples: 1000
  ci: 0.95
  unit: test queries (paired for differences)
